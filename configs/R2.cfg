hostname R2
interface FastEthernet0/0
 description RED-ZABBIX
 ip address 10.20.98.1 255.255.255.0
 no shutdown
interface GigabitEthernet1/0
 description ENLACE-R2-R1
 ip address 10.20.7.2 255.255.255.252
 ip ospf authentication message-digest
 no shutdown
router ospf 1
 router-id 2.2.2.2
 network 10.20.7.0 0.0.0.3 area 0
 network 10.20.98.0 0.0.0.255 area 0

