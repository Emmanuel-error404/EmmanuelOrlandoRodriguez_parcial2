<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Topología lógica del laboratorio de redes</title>
  <desc id="desc">Kali y Windows Server conectan al switch SW1; SW1 conecta con R1; R1 conecta por OSPF con R2; R2 conecta con el servidor Zabbix.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fb}.title{font:700 30px Arial,sans-serif;fill:#14213d}.subtitle{font:16px Arial,sans-serif;fill:#46556e}
      .node{fill:#fff;stroke:#315a8a;stroke-width:3;rx:18}.router{fill:#e6f1ff}.server{fill:#eef9f1}.switch{fill:#fff6df}
      .name{font:700 22px Arial,sans-serif;fill:#14213d;text-anchor:middle}.detail{font:16px Arial,sans-serif;fill:#34435a;text-anchor:middle}
      .link{stroke:#315a8a;stroke-width:5}.link2{stroke:#e07a2d;stroke-width:5}.label{font:16px Arial,sans-serif;fill:#263a57;text-anchor:middle}
      .net{font:700 15px Arial,sans-serif;fill:#39506e;text-anchor:middle}.note{font:14px Arial,sans-serif;fill:#56657b}
    </style>
  </defs>
  <rect class="bg" width="1400" height="760"/>
  <text class="title" x="700" y="56" text-anchor="middle">Laboratorio de parcial — topología lógica</text>
  <text class="subtitle" x="700" y="86" text-anchor="middle">Matrícula 20250798 · IPv4 · VLAN 1 · DHCP · OSPF MD5 · SNMP</text>

  <line class="link" x1="245" y1="230" x2="440" y2="345"/>
  <line class="link" x1="245" y1="500" x2="440" y2="390"/>
  <line class="link" x1="590" y1="365" x2="735" y2="365"/>
  <line class="link2" x1="865" y1="365" x2="1010" y2="365"/>
  <line class="link" x1="1140" y1="365" x2="1245" y2="365"/>

  <rect class="node server" x="70" y="170" width="175" height="120"/>
  <text class="name" x="157" y="210">Kali</text><text class="detail" x="157" y="240">eth0 · DHCP</text><text class="detail" x="157" y="265">10.20.25.101</text>

  <rect class="node server" x="70" y="440" width="175" height="120"/>
  <text class="name" x="157" y="480">Windows Server</text><text class="detail" x="157" y="510">Ethernet0</text><text class="detail" x="157" y="535">10.20.25.10</text>

  <rect class="node switch" x="440" y="305" width="150" height="120"/>
  <text class="name" x="515" y="345">SW1</text><text class="detail" x="515" y="375">IOSvL2 · VLAN 1</text><text class="detail" x="515" y="400">10.20.25.2</text>

  <rect class="node router" x="735" y="305" width="130" height="120"/>
  <text class="name" x="800" y="345">R1</text><text class="detail" x="800" y="375">C7200</text><text class="detail" x="800" y="400">.25.1 / .7.1</text>

  <rect class="node router" x="1010" y="305" width="130" height="120"/>
  <text class="name" x="1075" y="345">R2</text><text class="detail" x="1075" y="375">C7200</text><text class="detail" x="1075" y="400">.7.2 / .98.1</text>

  <rect class="node server" x="1245" y="305" width="130" height="120"/>
  <text class="name" x="1310" y="345">Zabbix</text><text class="detail" x="1310" y="375">eth0</text><text class="detail" x="1310" y="400">10.20.98.10</text>

  <text class="label" x="342" y="270">Gi0/0</text><text class="label" x="342" y="465">Gi0/1</text>
  <text class="label" x="662" y="345">Gi0/2 ↔ Fa0/0</text>
  <text class="net" x="662" y="390">10.20.25.0/24</text>
  <text class="label" x="937" y="345">Gi1/0 ↔ Gi1/0</text>
  <text class="net" x="937" y="390">10.20.7.0/30 · OSPF MD5</text>
  <text class="label" x="1192" y="345">Fa0/0 ↔ eth0</text>
  <text class="net" x="1192" y="390">10.20.98.0/24</text>

  <text class="note" x="700" y="680" text-anchor="middle">Diagrama lógico elaborado a partir de las interfaces e IP reportadas. Confirmar el cableado físico en el proyecto GNS3 antes de entregar.</text>
</svg>
